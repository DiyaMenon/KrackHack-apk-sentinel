name: APK Sentinel DevSecOps Pipeline

# Run this script every time code is pushed or a PR is opened
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security_scan:
    runs-on: ubuntu-latest
    name: SAST Vulnerability Scan

    steps:
      # 1. Grab the code from your repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Install your dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run APK Sentinel headlessly (No Streamlit UI, just the engine)
      - name: Run APK Sentinel Security Engine
        run: |
          # Assuming you commit a dummy app named app.apk to test against
          python main.py app.apk 

      # 5. Upload the generated PDF and HTML so judges can download them from GitHub!
      - name: Upload Security Reports
        if: always() # Upload reports even if the build fails
        uses: actions/upload-artifact@v4
        with:
          name: APK-Sentinel-Audit-Reports
          path: |
            report.html
            report.pdf
            report.json